name: Android CI
# Run on each isolated branch update to validate the exact feature head, including backend fixes.

on:
  push:
    branches: [ "main", "feature/community-server-authoritative-share-2026-11-20", "feature/single-admin-security-2026-11-20" ]
  pull_request:
    branches: [ "main", "integration/ak-test-series-complete-2026-11-20" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Setup Environment File
      run: cp .env.example .env

    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Check Firebase Functions JavaScript syntax
      run: |
        node --check backend_functions/index.js
        node --check backend_functions/examScoring.js
        node --check backend_functions/communityShare.js
        node --check backend_functions/authHelper.js
        node --check scripts/bootstrap_superadmin.js

    - name: Run Backend Scoring Tests
      run: node --test backend_functions/examScoring.test.js backend_functions/communityShare.test.js backend_functions/callableValidation.test.js

    - name: Run Unit Tests
      run: gradle testDebugUnitTest

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
