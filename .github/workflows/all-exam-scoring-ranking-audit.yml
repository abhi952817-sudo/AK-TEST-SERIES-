name: All-Exam Scoring and Ranking Audit CI

on:
  push:
    branches:
      - audit/all-exam-scoring-ranking-2026-11-13
  pull_request:
    branches:
      - main
    paths:
      - "app/src/main/java/Com/ak/testseries/exam/**"
      - "app/src/test/**"
      - "backend_functions/**"
      - "shared/scoring/**"
      - ".github/workflows/all-exam-scoring-ranking-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend scoring and callable unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Cloud Functions dependencies
        run: npm install --prefix backend_functions --no-audit --no-fund

      - name: Check backend JavaScript syntax
        run: |
          node --check backend_functions/index.js
          node --check backend_functions/examScoring.js

      - name: Run backend unit tests
        run: node --test backend_functions/examScoring.test.js backend_functions/callableValidation.test.js

  android-tests-and-apk:
    name: Android unit tests and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      - name: Prepare local environment file
        run: cp .env.example .env

      - name: Generate temporary debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Run complete Android unit test task
        run: gradle :app:testDebugUnitTest --info --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Android test reports and Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-exam-audit-android-results
          if-no-files-found: warn
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
