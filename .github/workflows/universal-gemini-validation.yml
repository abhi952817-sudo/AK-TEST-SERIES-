name: Universal Gemini AI Validation

on:
  push:
    branches:
      - feature/universal-gemini-ai-10-phase-2026-11-08
  pull_request:
    branches:
      - main

concurrency:
  group: universal-gemini-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-functions-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_functions
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: backend_functions/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend unit tests
        run: node --test *.test.js

  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Prepare debug signing key
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Run Android unit tests with full diagnostics
        run: gradle :app:testDebugUnitTest --info --stacktrace
      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
