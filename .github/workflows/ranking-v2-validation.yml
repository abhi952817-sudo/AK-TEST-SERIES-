name: Ranking V2 Validation

concurrency:
  group: universal-exam-scoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, feature/ranking-engine-v2-2026-11-06]
  push:
    branches: [feature/ranking-engine-v2-2026-11-06, feature/universal-exam-scoring-v1-2026-11-06]

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend_functions/package-lock.json
      - run: npm ci --prefix backend_functions
      - name: Syntax-check ranking backend
        run: |
          node --check backend_functions/index.js
          node --check backend_functions/examScoring.js
          node --check backend_functions/rankingEngine.js
      - name: Run scoring, callable security, and ranking unit tests
        run: node --test backend_functions/examScoring.test.js backend_functions/callableValidation.test.js backend_functions/rankingEngine.test.js

  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install emulator test dependencies
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
      - name: Run Firestore security rules tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
        run: npx firebase emulators:exec --only firestore --project demo-no-project "node --test firestore.test.js"

  android-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Setup Environment File
        run: cp .env.example .env
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Run Android unit tests and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-${{ github.run_number }}
          path: app/schemas/Com.ak.testseries.data.AppDatabase/*.json
          if-no-files-found: warn
